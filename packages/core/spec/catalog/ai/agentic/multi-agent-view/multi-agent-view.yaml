id: multi-agent-view
name: Multi-agent views
kind: component
catalog: ai
group: agentic
tier: 3
maturity: experimental
status: draft
version: 0.1.0
summary: A list of runs is the baseline shape; graph canvases are a product in themselves.
aliases:
  - Agents Window / Agent Tabs (Cursor)
  - agent teams (Claude Code)
  - parallel tasks (Codex)
  - "Workflow canvas (AI Elements: Canvas, Node, Edge, Connection, Controls, Panel, Toolbar)"
found_in:
  - Cursor
  - Claude Code
  - OpenAI Codex
  - AI Elements
anatomy:
  - part: list-kanban-of-runs
    description: list/kanban of runs (each a job card) grouped by status
  - part: side-by-side-chat-tabs
    description: side-by-side chat tabs or grid
  - part: optional-graph-canvas
    description: optional graph canvas for authored workflows
  - part: compare-outputs
    description: compare outputs (best-of-n)
states:
  - id: input-available
modes:
  - id: needs-input
  - id: done
  - id: comparing
api:
  interactions:
    - open run
    - compare
    - merge/select winner
    - stop all
accessibility:
  notes: List semantics for runs; canvas requires a list alternative; comparison as a table.
