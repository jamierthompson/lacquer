# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: approval-prompt
name: Permission / approval prompt
kind: component
catalog: ai
group: agentic
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary: "Gate for side-effecting actions: exact payload, risk framing, and allow-once / always-scoped /
  deny-with-correction."
aliases:
  - Confirmation (AI Elements)
  - permission prompt (Claude Code)
  - terminal command approval (VS Code)
  - sandbox access controls (Cursor)
  - useHumanInTheLoop (CopilotKit)
  - Intent Preview (Smashing)
  - Controls (Shape of AI)
found_in:
  - Claude Code
  - VS Code Copilot
  - Cursor
  - ChatGPT Agent
  - AI Elements
  - CopilotKit
anatomy:
  - part: title-naming
    description: title naming the action in plain language
  - part: exact-payload
    description: exact payload (monospace when a command)
  - part: risk-framing
    description: "risk framing: what it touches, reversibility, leaves sandbox/repo?"
  - part: actions
    description: "actions: Allow once (default focus), Always allow [scoped], Deny (+ correction field)"
  - part: optional-switch
    description: optional 'switch to auto mode'
states:
  - id: approval-requested
  - id: output-denied
modes:
  - id: approved
  - id: approved-always
    notes: approved-always (rule saved)
  - id: denied-with-correction
  - id: timed-out
api:
  interactions:
    - Enter = allow once
    - Esc = deny
    - type a correction
    - view what a saved rule would cover
accessibility:
  notes: Assertive announcement; focus moves into the prompt; safest option is default; fully keyboard operable.
tokens:
  consumes:
    - color.status.error
    - color.status.warning
    - color.status.success
    - type.family.mono
    - color.bg.surface-raised
    - shadow.lg
usage:
  use_when:
    - any action outside the sandbox or with external effects
  avoid_when:
    - an 'always' option that grants more than the prompt showed
    - prompting for read-only actions
  pairs_well_with:
    - tool-call-card
    - autonomy-dial
    - activity-log
    - undo-rollback
    - hitl-gate
  reuses:
    - alert-dialog
    - code-block
    - button
    - textarea
    - badge
  exemplars:
    - Claude Code — offers 'don't ask again' only when the prompt can show everything the rule would allow;
      never auto-approves protected paths; pauses auto mode after repeated blocks
    - AI Elements Confirmation — request/accepted/rejected wired to needsApproval
    - NN/g — ChatGPT Agent 'requested final approval before submitting the reservation'
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://code.claude.com/docs/en/permissions
  - https://code.claude.com/docs/en/permission-modes
  - https://elements.ai-sdk.dev/components/confirmation
  - https://www.smashingmagazine.com/2026/02/designing-agentic-ai-practical-ux-patterns/
