# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: agent-status
name: Agent status and step progress
kind: component
catalog: ai
group: agentic
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary: A persistent, plain-language indicator of what the agent is doing and whether it is blocked on the human.
aliases:
  - Agents window status (Cursor)
  - status bar mode indicator (Claude Code)
  - CopilotKit agent state
  - run status pill
found_in:
  - Cursor
  - Claude Code
  - GitHub Copilot
  - CopilotKit
  - Devin
anatomy:
  - part: status-pill
    description:
      "status pill: thinking / working (current step) / waiting-for-tool / needs-input / paused / done
      / failed / cancelled"
  - part: current-mode-label
    description: current mode label
  - part: elapsed-time
    description: elapsed time
  - part: stop-and-pause
    description: stop and pause controls
states:
  - id: cancelled
modes:
  - id: thinking
  - id: working
  - id: waiting-for-tool
  - id: needs-input
  - id: paused
  - id: done
  - id: failed
api:
  interactions:
    - stop
    - pause/resume
    - open run
    - answer question without stopping unrelated work
accessibility:
  notes: Status region announces transitions once; needs-input is assertive; mode label is text, not colour only.
tokens:
  consumes:
    - color.status.running
    - color.status.warning
    - color.status.success
    - color.status.error
    - type.label.sm
usage:
  use_when:
    - any long-running agent
  avoid_when:
    - hiding 'needs input' inside the transcript where it can be missed
  pairs_well_with:
    - plan-view
    - background-job-card
    - hitl-gate
    - autonomy-dial
  reuses:
    - badge
    - spinner
    - button
    - tooltip
  exemplars:
    - Claude Code — '⏸ plan mode on', '⏵⏵ auto mode on' in the status bar
    - Cursor 2.4 — agents ask clarifying questions while continuing file operations
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://code.claude.com/docs/en/permission-modes
  - https://cursor.com/changelog/2-4
