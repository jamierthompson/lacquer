# Source of truth for this entry. SKILL.md and dist/ are generated from it by `pnpm build`.

id: live-region-strategy
name: Live-region strategy for streamed output
kind: method
catalog: ai
group: foundations
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary:
  "How screen-reader users experience streaming without being buried: batched, transition-based
  announcements from a single pre-existing region."
aliases:
  - aria-live polite status region
  - role=alert for errors/approvals
  - WCAG 2.2 SC 4.1.3 Status Messages
found_in:
  - assistant-ui
  - AI Elements (Radix primitives)
  - ChatGPT
  - Claude
anatomy:
  - part: one-hidden-role-status
    description: one hidden role=status region created empty at mount
  - part: sentence-paragraph-batching
    description: sentence/paragraph batching (or ~1–2 s), aria-atomic=false, aria-relevant=additions
  - part: one-announcement-per
    description: one announcement per state transition and per tool transition
  - part: role-alert-for-errors
    description: role=alert for errors and approvals
  - part: response-complete-once
    description: "'Response complete' once"
  - part: setting
    description: "setting: announce full response at end only"
states:
  - id: enabled
api:
  interactions: []
accessibility:
  notes:
    Never per-token; never aria-live on the whole list plus a status region; region must pre-exist in the
    DOM (MDN).
usage:
  use_when:
    - any streamed content
  avoid_when:
    - per-token announcements
    - assertive for routine progress
  pairs_well_with:
    - message-state-machine
    - streaming-markdown
    - approval-prompt
  reuses:
    - visually-hidden
  exemplars:
    - MDN — start with an empty live region, then change its content; polite for non-urgent
    - assistant-ui Error — accessible alert role
rules:
  shared: []
sources:
  - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Guides/Live_regions
  - https://www.a11y-collective.com/blog/aria-live/
  - https://www.assistant-ui.com/docs/primitives
