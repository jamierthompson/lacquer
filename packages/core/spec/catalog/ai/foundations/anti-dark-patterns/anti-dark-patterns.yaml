id: anti-dark-patterns
name: AI-specific dark patterns and countermeasures
kind: principle
catalog: ai
group: foundations
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary: Maps each documented LLM dark pattern to the UI amplifier to prohibit and the system-level countermeasure.
aliases:
  - "DarkBench: brand bias, user retention, sycophancy, anthropomorphism, harmful generation, sneaking"
  - Dark Matter (Shape of AI)
found_in:
  - DarkBench (ICLR 2025)
  - OpenAI sycophancy postmortem
  - Shape of AI
anatomy:
  - part: sycophancy-reason-coded
    description: sycophancy → reason-coded feedback, no reward for agreement
  - part: retention-hooks
    description: retention hooks → task-relevant follow-ups only, no streaks, temporary mode
  - part: fake-urgency
    description: fake urgency → real progress and quota facts only
  - part: anthropomorphism-ai
    description: anthropomorphism → AI label, no fake typing delays, no human names/avatars by default
  - part: hidden-data-use
    description: hidden data use → memory chip, consent at first run
  - part: sneaking-brand-bias
    description: sneaking/brand bias → 'Sponsored' variant, domain-first citations
states:
  - id: enabled
