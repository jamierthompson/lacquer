# Source of truth for this entry. SKILL.md and dist/ are generated from it by `pnpm build`.

id: message-state-machine
name: Message state machine
kind: principle
catalog: ai
group: foundations
tier: 1
maturity: established
status: draft
version: 0.1.0
summary:
  Name the assistant-turn lifecycle once and make every AI component render from it; it is the first
  thing to build.
aliases:
  - "AI SDK status: submitted / streaming / ready / error"
  - assistant-ui running state
  - "Tool states: input-streaming … output-denied"
found_in:
  - Vercel AI SDK
  - AI Elements
  - assistant-ui
  - Gradio
  - Streamlit
states:
  - id: idle
    treatment: Nothing pending. No assistant slot is rendered; the composer shows Send, disabled while the draft is empty.
    a11y: none
  - id: submitted
    treatment: The user message is rendered and the assistant slot shows the thinking indicator; the composer shows Stop.
    a11y: One polite announcement, "Thinking".
  - id: streaming
    treatment:
      The sub-state picks the component. reasoning opens the reasoning disclosure, tool renders a tool card
      in input-available, text renders markdown progressively with a caret. The composer shows Stop throughout.
    a11y:
      One polite announcement on entering each sub-state ("Reasoning", "Running {tool}"); text is batched
      into sentences, at most one announcement per 2 s (LQ-A11Y-01).
    notes: Sub-states reasoning | tool | text are rendered by different components but share one composer control.
  - id: awaiting-approval
    treatment:
      The approval prompt is shown and everything else pauses, including the stream; the composer still
      shows Stop, because the turn is not over.
    a11y: 'The only assertive announcement, "Approval needed: {action}". Focus moves to the prompt''s safe option.'
  - id: complete
    treatment: The caret is removed and the actions bar appears; the composer returns to Send.
    a11y: Polite "Response complete", then the message's focus rules apply.
  - id: error
    treatment:
      An inline error with Retry replaces the assistant slot's pending indicator; the user's draft is
      preserved (LQ-ERR-01); the composer shows Send.
    a11y: role="alert" on the error message, not on the whole message.
  - id: cancelled
    treatment: Partial output stays on screen, marked "Stopped" (LQ-MACHINE-03); the composer shows Send.
    a11y: Polite "Stopped".
machine:
  initial: idle
  states:
    - id: idle
      user_sees: Nothing pending.
      composer_control: Send (disabled if empty)
      announcement: none
    - id: submitted
      user_sees: User message rendered; assistant slot shows the thinking indicator.
      composer_control: Stop
      announcement: '"Thinking" (once)'
    - id: streaming:reasoning
      user_sees: Reasoning disclosure open and shimmering.
      composer_control: Stop
      announcement: '"Reasoning" (once)'
    - id: streaming:tool
      user_sees: Tool card in input-available.
      composer_control: Stop
      announcement: '"Running {tool}" (once per tool)'
    - id: streaming:text
      user_sees: Markdown renders progressively with a caret.
      composer_control: Stop
      announcement: Batched sentences, at most one per 2 s (LQ-A11Y-01).
    - id: awaiting-approval
      user_sees: Approval prompt; everything else paused.
      composer_control: Stop
      announcement: 'Assertive: "Approval needed: {action}"'
    - id: complete
      terminal: true
      user_sees: Actions bar appears; caret removed.
      composer_control: Send
      announcement: '"Response complete", then focus rules.'
    - id: error
      terminal: true
      user_sees: Inline error state with Retry; the user's input is preserved.
      composer_control: Send
      announcement: role="alert"
    - id: cancelled
      terminal: true
      user_sees: Partial output kept, marked "Stopped".
      composer_control: Send
      announcement: '"Stopped"'
  transitions:
    - from: idle
      to: submitted
      on: send
    - from: submitted
      to: streaming:reasoning
      on: reasoning-delta
    - from: submitted
      to: streaming:tool
      on: tool-input-start
    - from: submitted
      to: streaming:text
      on: text-delta
    - from: streaming:reasoning
      to: streaming:tool
      on: tool-input-start
    - from: streaming:reasoning
      to: streaming:text
      on: text-delta
    - from: streaming:tool
      to: awaiting-approval
      on: approval-requested
    - from: awaiting-approval
      to: streaming:tool
      on: approval-responded
    - from: streaming:tool
      to: streaming:text
      on: text-delta
    - from: streaming:tool
      to: streaming:tool
      on: tool-input-start
    - from: streaming:text
      to: streaming:tool
      on: tool-input-start
    - from: streaming:text
      to: complete
      on: finish
    - from: streaming:tool
      to: complete
      on: finish
    - from: submitted
      to: error
      on: error
    - from: streaming:reasoning
      to: error
      on: error
    - from: streaming:tool
      to: error
      on: error
    - from: streaming:text
      to: error
      on: error
    - from: submitted
      to: cancelled
      on: stop
    - from: streaming:reasoning
      to: cancelled
      on: stop
    - from: streaming:tool
      to: cancelled
      on: stop
    - from: streaming:text
      to: cancelled
      on: stop
    - from: awaiting-approval
      to: cancelled
      on: stop
    - from: complete
      to: submitted
      on: regenerate
    - from: error
      to: submitted
      on: retry
    - from: cancelled
      to: submitted
      on: regenerate
    - from: complete
      to: submitted
      on: send
    - from: error
      to: submitted
      on: send
    - from: cancelled
      to: submitted
      on: send
api:
  events:
    - name: send
      description:
        The user submits the composer. idle → submitted; from a terminal state a new turn starts the same
        way, which is why the composer shows Send there.
    - name: reasoning-delta
      description: First reasoning token. submitted → streaming:reasoning.
    - name: tool-input-start
      description: A tool part begins. Enters streaming:tool from any streaming state or from submitted.
    - name: approval-requested
      description: A tool needs a decision. streaming:tool → awaiting-approval; the stream pauses.
    - name: approval-responded
      description: The user allowed or denied. awaiting-approval → streaming:tool.
    - name: text-delta
      description: First text token. Enters streaming:text from submitted, reasoning or tool.
    - name: finish
      description: The transport ends the turn. streaming:text or streaming:tool → complete.
    - name: error
      description: The transport fails. Any non-terminal state except idle → error.
    - name: stop
      description: The user presses Stop. Any non-terminal state except idle → cancelled.
    - name: retry
      description: From error, back to submitted with the same input.
    - name: regenerate
      description: From complete or cancelled, back to submitted with the same input.
  composition: >
    Expose one `status` value per thread and one `state` per tool part, from the transport (AI SDK `status`,
    assistant-ui `isRunning`, or your own reducer). Components receive it as a prop. No component may compute
    its state from message text. The reducer is a lookup in the transitions table above: the status only
    changes on a listed (from, on) pair, and every other event is ignored (LQ-MACHINE-04). The React
    implementation will ship the table in its own file, with a test that asserts it equals this one, so the
    code cannot drift from this file.
accessibility:
  name: Not applicable; this principle defines the announcements other components make.
  announcements:
    Each transition maps to exactly one announcement, listed per state above. Streaming text is
    batched. Approval is the only assertive announcement.
tokens:
  defines:
    - color.status.pending
    - color.status.running
    - color.status.success
    - color.status.error
    - color.status.warning
usage:
  use_when:
    - Always, before any other AI component.
  avoid_when:
    - Inferring state from content (e.g. "ends with ```" means streaming).
  pairs_well_with:
    - stop-regenerate-always
    - live-region-strategy
    - composer
    - message
    - tool-call-card
  exemplars:
    - AI Elements Tool — seven states with badge labels.
    - AI Elements PromptInputSubmit — the send/stop icon follows status.
rules:
  shared:
    - LQ-RECOVER-01
    - LQ-ERR-01
    - LQ-A11Y-01
  local:
    - id: LQ-MACHINE-01
      level: MUST
      polarity: require
      title: One lifecycle, consumed everywhere
      statement:
        Every AI component's visual state is a pure function of the thread status or a tool part's state;
        no component inspects message text to decide how to render.
      detect:
        static: No regex/includes/endsWith on message content in render logic across the implementation.
      fix: Pass the status down; see tool-call-card for the shape.
    - id: LQ-MACHINE-02
      level: MUST
      polarity: require
      title: Stop in every non-idle state, Regenerate in every terminal state
      statement:
        Stop is wired while status is submitted, streaming:* or awaiting-approval; Regenerate and
        Edit-and-resend are wired in complete, error and cancelled.
      detect:
        runtime: Drive each state and assert the control is present and enabled.
      fix: Derive the composer's primary control from status.
    - id: LQ-MACHINE-03
      level: MUST
      polarity: require
      title: Cancel keeps the partial
      statement: Stopping a stream keeps the partial output on screen, marked as stopped; it is never cleared.
      detect:
        runtime: Stop mid-stream; the message body is non-empty and carries data-state="cancelled".
      fix: Transition to cancelled, do not reset the message.
    - id: LQ-MACHINE-04
      level: MUST
      polarity: forbid
      title: No transition outside the table
      statement:
        The status changes only through a row of the transitions table; an event with no row for the
        current status is ignored, never handled by an extra branch beside the table.
      rationale:
        Every "just this once" branch is a state the spec does not know about, and every component downstream
        renders it wrong.
      detect:
        static: The reducer is a lookup over the transitions table; no assignment to status exists outside it.
        runtime: Dispatch every event in every status; the status changes only on the listed pairs.
      fix: Add the row to the spec first, then the table follows. Never the other way round.
    - id: LQ-MACHINE-05
      level: MUST
      polarity: forbid
      title: No second source of truth for the lifecycle
      statement:
        A thread holds one status value; no `isLoading`, `isStreaming` or `done` flag lives beside it that
        could disagree with it.
      detect:
        static: A loading, streaming or done boolean stored in thread state alongside a status.
      fix: Derive the boolean from status at the point of use (`status !== "idle" && !terminal`).
grading:
  weight: 2
  notes: Violations here cascade into every component in the transcript; graded once per screen, weighted high.
sources:
  - https://elements.ai-sdk.dev/components/tool
  - https://elements.ai-sdk.dev/components/prompt-input
  - https://developer.apple.com/design/human-interface-guidelines/generative-ai
