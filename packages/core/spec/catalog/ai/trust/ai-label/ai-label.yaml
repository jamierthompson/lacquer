# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: ai-label
name: AI disclosure label / badge
kind: component
catalog: ai
group: trust
tier: 1
maturity: established
status: draft
version: 0.1.0
summary: Marks AI-generated content and is the doorway to explainability; in the EU, first-turn disclosure is
  required from 2 August 2026.
aliases:
  - AI label (IBM Carbon, formerly AI slug)
  - Disclosure (Shape of AI)
  - AI badge (Intercom Fin)
  - Generated with AI chip
  - Article 50 disclosure
found_in:
  - IBM Carbon
  - Intercom Fin
  - Microsoft Copilot
  - Gemini
  - Zoom
  - Notion
anatomy:
  - part: ai-button
    description: "'AI' button or chip (mini 16 px to XL 64 px; inline variant for text)"
  - part: explainability-popover
    description: "explainability popover: overview, supporting details, resources, actions"
  - part: revert-button-replaces
    description: revert button replaces label after user override
  - part: actor-name-glyph
    description: actor name/glyph on messages
  - part: first-turn-chatbot-disclosure
    description: first-turn chatbot disclosure
states:
  - id: enabled
modes:
  - id: present
  - id: explained
    notes: explained (popover open)
  - id: overridden
    notes: overridden (revert shown)
  - id: hidden
    notes: hidden (no AI involvement)
api:
  interactions:
    - click for explanation
    - revert to AI version
    - never triggers generation
accessibility:
  notes: Button named 'AI generated, show details'; popover is a dialog/tooltip with focus management; label
    text translatable.
tokens:
  consumes:
    - color.accent.ai
    - color.border.ai
    - color.accent.ai-subtle
    - type.label.sm
    - radius.sm
usage:
  use_when:
    - any AI-generated content in a mixed human/AI product
    - chatbots (first turn)
  avoid_when:
    - as decoration
    - as the trigger for AI actions (Carbon)
  pairs_well_with:
    - explainability-popover
    - mistakes-disclaimer
    - content-credentials
    - ai-summary-card
  reuses:
    - badge
    - popover
    - button
    - icon
  exemplars:
    - Carbon — 'the key pathway to AI explainability'; revert replaces label
    - Shape of AI — 'Name the actor, every time'; 'Label the action, not just the feature'
    - EU AI Act Art. 50(1) — inform from the start of the first interaction
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://carbondesignsystem.com/components/ai-label/usage/
  - https://www.shapeof.ai/patterns/disclosure
  - https://digital-strategy.ec.europa.eu/en/faqs/transparency-obligations-under-article-50-ai-act
