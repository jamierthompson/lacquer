# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: content-credentials
name: Provenance for generated media (content credentials)
kind: component
catalog: ai
group: trust
tier: 2
maturity: emerging
status: draft
version: 0.1.0
summary: Generated images carry a machine-readable credential and a visible affordance to inspect it; required
  in the EU for synthetic media marking.
aliases:
  - Content Credentials (C2PA)
  - SynthID (Google)
  - Watermark (Shape of AI)
  - Made with AI labels
found_in:
  - ChatGPT images
  - OpenAI API/Codex images
  - Google Pixel
  - Adobe Firefly
  - Instagram
anatomy:
  - part: invisible-credential-watermark-embedded
    description: invisible credential/watermark embedded in the file
  - part: visible-info-glyph
    description: visible info glyph on the media
  - part: credentials-panel
    description: "credentials panel: tool, model, date, edits"
  - part: download-preserves-metadata
    description: download preserves metadata by default
states:
  - id: enabled
modes:
  - id: credentialed
  - id: unverified
  - id: stripped
api:
  interactions:
    - open panel
    - verify
    - download with credentials
accessibility:
  notes: Glyph is a button named 'Content credentials'; panel is a dialog with text content.
tokens:
  consumes:
    - color.bg.surface-raised
    - radius.sm
    - type.label.sm
    - shadow.sm
usage:
  use_when:
    - any generated or AI-edited image, audio or video
  avoid_when:
    - stripping metadata on export by default
  pairs_well_with:
    - attachment-preview
    - variation-grid
    - ai-label
  reuses:
    - icon-button
    - dialog
    - list
    - badge
  exemplars:
    - OpenAI + Google (19 May 2026) — C2PA steering committee, SynthID in ChatGPT/API/Codex images, detection
      coming to Search and Chrome
    - EU AI Act Art. 50(2) — machine-readable marking; interoperability deadline 2 Feb 2027
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://c2paviewer.com/articles/openai-google-c2pa-synthid-2026
  - https://www.reedsmith.com/our-insights/blogs/viewpoints/102nbz0/transparency-obligations-for-ai-generated-content-the-code-of-practice-adequacy/
