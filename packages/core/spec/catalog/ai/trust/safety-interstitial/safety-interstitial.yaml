  exposing policy text.
aliases:
  - blocked request screen
  - content policy notice
  - Guardrails (Shape of AI)
found_in:
  - ChatGPT
  - Claude
  - Gemini
  - Copilot
anatomy:
  - part: calm
    description: calm, non-red panel
  - part: reason-category
    description: reason category
  - part: what-is-allowed
    description: what is allowed / how to rephrase
  - part: appeal-or-feedback
    description: appeal or feedback path
  - part: resources-in-sensitive
    description: resources in sensitive domains
states:
  - id: enabled
modes:
  - id: blocked
  - id: partially-scoped
  - id: appealed
api:
  interactions:
    - rephrase
    - report false positive
    - learn more
accessibility:
  notes: Status region (polite), not an alert; content readable; no auto-dismiss.
