  - permission modes (Claude Code)
  - Code/Chat (Windsurf)
found_in:
  - ChatGPT
  - Gemini
  - Claude
  - Cursor
  - Lovable
  - Windsurf
  - AI Elements
anatomy:
  - part: mode
    description: "mode: segmented control or toggle in the composer with plain-word labels and one-line 'best for'"
  - part: model
    description: "model: menu or searchable palette grouped by provider with logos"
  - part: current-selection-badge
    description: current selection badge
states:
  - id: enabled
modes:
  - id: default
  - id: open
  - id: changed-mid-thread
