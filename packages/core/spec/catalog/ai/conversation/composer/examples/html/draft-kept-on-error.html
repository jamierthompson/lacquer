<!--
  id: draft-kept-on-error — captured after the transport failed. The status
  is error, the control is Send again, and the draft the user typed during
  the turn is still in the textarea (LQ-COMPOSER-02, LQ-ERR-01). The error
  itself and its Retry live in the message, not here; the composer shows no
  error styling of its own.
-->
<form
  data-lacquer="composer"
  data-density="full"
  data-status="error"
  aria-label="Message"
>
  <div data-slot="frame">
    <div
      data-lacquer="textarea"
      data-slot="textarea"
      data-sizing="autosize"
      data-frame="borderless"
    >
      <textarea
        data-slot="control"
        rows="1"
        aria-label="Message"
        placeholder="Message…"
      >
and then shorten it</textarea>
    </div>
    <div data-slot="footer">
      <button
        type="button"
        data-lacquer="icon-button"
        data-slot="primary-control"
        data-action="send"
        data-emphasis="filled"
        data-shape="round"
        aria-label="Send message"
        aria-keyshortcuts="Enter"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
    </div>
  </div>
</form>
