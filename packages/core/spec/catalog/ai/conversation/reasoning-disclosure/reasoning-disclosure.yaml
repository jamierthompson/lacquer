# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: reasoning-disclosure
name: Reasoning / extended-thinking disclosure
kind: component
catalog: ai
group: conversation
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary: A collapsible, de-emphasised view of the model's reasoning or step trace that opens while streaming
  and collapses when the answer begins.
aliases:
  - Reasoning (AI Elements, prompt-kit)
  - ChainOfThought (assistant-ui, AI Elements)
  - Thought for N seconds (ChatGPT)
  - Show thinking (Gemini)
  - Stream of Thought (Shape of AI)
  - Chainlit Step cot
found_in:
  - ChatGPT
  - Claude
  - Gemini
  - Perplexity
  - AI Elements
  - assistant-ui
  - prompt-kit
  - Chainlit
anatomy:
  - part: collapsible-trigger
    description: collapsible trigger with status text and elapsed time
  - part: muted-reasoning-text
    description: muted reasoning text
  - part: optional-step-list
    description: optional step list with complete/active/pending
  - part: optional-search-results
    description: optional search results and images per step
states:
  - id: streaming
  - id: complete
modes:
  - id: pinned-open
  - id: hidden
    notes: hidden (no reasoning)
api:
  interactions:
    - auto-open while streaming, auto-close when answer starts
    - user toggle overrides
    - steps expand to show outputs
accessibility:
  notes: Disclosure button with aria-expanded and a region; reasoning text not announced live; announce start
    once and duration on completion.
tokens:
  consumes:
    - color.fg.muted
    - type.body.sm
    - shimmer.duration
    - space.gap.sm
usage:
  use_when:
    - reasoning models
    - research/agent products where steps and sources matter
  avoid_when:
    - styling reasoning as proof of correctness
    - expanding by default after completion
  pairs_well_with:
    - thinking-indicator
    - tool-call-card
    - disclosure-conventions
  reuses:
    - disclosure
    - badge
    - list
  exemplars:
    - AI Elements Reasoning — auto open/close, 'Thought for N seconds'
    - Anthropic (Feb 2025) — caveat that visible thinking may not reflect the model's actual process
    - Perplexity — 'Completed 2 steps' before the answer
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://elements.ai-sdk.dev/components/reasoning
  - https://elements.ai-sdk.dev/components/chain-of-thought
  - https://www.anthropic.com/news/visible-extended-thinking
