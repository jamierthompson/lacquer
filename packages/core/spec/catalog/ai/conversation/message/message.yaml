# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: message
name: Message (user / assistant)
kind: component
catalog: ai
group: conversation
tier: 1
maturity: established
status: draft
version: 0.1.0
summary:
  User messages are right-aligned bubbles; assistant messages are full-width, unbubbled containers for
  ordered parts (reasoning, tools, text, sources, actions).
aliases:
  - Message (AI Elements, prompt-kit)
  - UserMessage / AssistantMessage (assistant-ui)
  - st.chat_message (Streamlit)
found_in:
  - ChatGPT
  - Claude
  - Gemini
  - AI Elements
  - assistant-ui
  - prompt-kit
anatomy:
  - part: identity-row
    description: identity row (optional name / AI label)
  - part: parts-in-order
    description: "parts in order: reasoning, tool cards, streamed content, media, sources row"
  - part: actions-bar
    description: actions bar
  - part: branch-picker
    description: branch picker
  - part: user-variant
    description: "user variant: bubble with edit affordance and attachment chips"
states:
  - id: streaming
  - id: complete
  - id: error
  - id: cancelled
modes:
  - id: edited
  - id: branch-n-of-m
    notes: branch n-of-m
api:
  interactions:
    - hover/focus reveals actions
    - edit turns user bubble into inline composer
    - regenerate creates sibling branch
accessibility:
  notes: Article with accessible name (You said / Assistant said); actions visible on focus; edit is a real form.
tokens:
  consumes:
    - color.bg.user-bubble
    - radius.bubble
    - color.bg.assistant
    - space.gap.message
    - type.body.md
    - size.measure.prose
usage:
  use_when:
    - any thread
  avoid_when:
    - symmetric bubble layouts that make assistant prose narrow and hard to read
  pairs_well_with:
    - streaming-markdown
    - message-actions
    - branch-picker
    - reasoning-disclosure
    - tool-call-card
  reuses:
    - avatar
    - badge
    - icon-button
    - textarea
  exemplars:
    - AI Elements Message — from='user|assistant' switches bubble vs full-width
    - ChatGPT/Claude — assistant text without bubble, no avatar required
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://elements.ai-sdk.dev/components/message
