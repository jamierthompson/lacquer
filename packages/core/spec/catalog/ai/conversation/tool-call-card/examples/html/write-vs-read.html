<!--
  id: write-vs-read — the effect axis is visible while collapsed (LQ-TOOL-02).
  A read has no edge; a write has a running-coloured edge; a destroy has an
  error-coloured edge and, here, is also waiting for approval.
-->
<div style="display: grid; gap: var(--lq-space-gap-sm)">
  <div
    role="group"
    aria-labelledby="w1-name"
    data-lacquer="tool-call-card"
    data-state="output-available"
    data-effect="read"
    data-density="row"
  >
    <button
      type="button"
      data-slot="header"
      aria-expanded="false"
      aria-controls="w1-body"
    >
      <span data-slot="name" id="w1-name">Read 3 files</span>
      <span data-slot="status">Completed</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div
      data-slot="body"
      id="w1-body"
      role="region"
      aria-labelledby="w1-name"
      hidden
    >
      <pre data-slot="output">{ "files": 3 }</pre>
    </div>
  </div>

  <div
    role="group"
    aria-labelledby="w2-name"
    data-lacquer="tool-call-card"
    data-state="output-available"
    data-effect="write"
    data-density="row"
  >
    <button
      type="button"
      data-slot="header"
      aria-expanded="false"
      aria-controls="w2-body"
    >
      <span data-slot="name" id="w2-name">Wrote src/button.css</span>
      <span data-slot="status">Completed</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div
      data-slot="body"
      id="w2-body"
      role="region"
      aria-labelledby="w2-name"
      hidden
    >
      <pre data-slot="output">{ "bytes": 2048 }</pre>
    </div>
  </div>

  <div
    role="group"
    aria-labelledby="w3-name"
    data-lacquer="tool-call-card"
    data-state="approval-requested"
    data-effect="destroy"
    data-density="row"
  >
    <button
      type="button"
      data-slot="header"
      aria-expanded="true"
      aria-controls="w3-body"
    >
      <span data-slot="name" id="w3-name">Delete dist/ (14 files)</span>
      <span data-slot="status">Needs approval</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div data-slot="body" id="w3-body" role="region" aria-labelledby="w3-name">
      <pre data-slot="input">{ "path": "dist/" }</pre>
      <div data-slot="approval">
        <form
          data-lacquer="approval-prompt"
          data-state="approval-requested"
          data-effect="destroy"
          aria-labelledby="w3a-title"
        >
          <div data-slot="title" id="w3a-title" role="alert">
            <span data-slot="eyebrow">Approval needed</span>
            Delete dist/ (14 files) in this repo
          </div>
          <pre data-slot="payload" data-format="command">rm -rf dist/</pre>
          <div data-slot="actions">
            <button
              type="submit"
              data-lacquer="button"
              data-slot="allow"
              data-emphasis="destructive"
              data-size="sm"
            >
              <span data-slot="label">Allow once</span>
            </button>
            <button
              type="button"
              data-lacquer="button"
              data-slot="deny"
              data-emphasis="outline"
              data-size="sm"
              autofocus
            >
              <span data-slot="label">Deny</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
