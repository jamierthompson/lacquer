    - preview-chat-split
    - diff-review
    - streaming-markdown
  reuses:
    - drawer
    - tabs
    - code-block
    - toolbar
    - button
    - segmented-control
  exemplars:
    - Claude Artifacts — version selector, 'Edit with Claude' on selection, publish
    - AI Elements Artifact — header/actions/content composition
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
