# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: generation-progress
name: Generation progress
kind: component
catalog: ai
group: generation
tier: 1
maturity: established
status: draft
version: 0.1.0
summary: A ladder from shimmer to steps to a real determinate bar, with a background-job hand-off for long runs.
aliases:
  - Shimmer / Plan streaming (AI Elements)
  - st.status (Streamlit)
  - Deep Research progress
  - image generation percent + blurred preview
found_in:
  - ChatGPT
  - Gemini
  - Perplexity
  - Lovable
  - v0
  - AI Elements
  - Streamlit
anatomy:
  - part: indeterminate-shimmer
    description: indeterminate shimmer (<5 s)
  - part: step-list
    description: step list with active step (5 s–1 min)
  - part: determinate-bar
    description: determinate bar with count or ETA (>1 min, real numbers only)
  - part: background-job-hand-off
    description: background job hand-off
states:
  - id: indeterminate
modes:
  - id: stepped
  - id: determinate
  - id: backgrounded
  - id: done
  - id: failed
api:
  interactions:
    - stop
    - run in background
    - open partial results
accessibility:
  notes: progressbar semantics when determinate; status region for step changes (once per step).
tokens:
  consumes:
    - shimmer.duration
    - color.accent.brand
    - color.status.running
    - type.body.sm
usage:
  use_when:
    - any generation longer than a second
  avoid_when:
    - invented progress values
    - showing 100% before the result
  pairs_well_with:
    - thinking-indicator
    - background-job-card
    - latency-patterns
  reuses:
    - progress
    - skeleton
    - list
    - spinner
  exemplars:
    - Apple HIG — generate in the background while a person uses another part of the app
    - Perplexity — visible retrieval steps
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://developer.apple.com/design/human-interface-guidelines/generative-ai
  - https://elements.ai-sdk.dev/components/plan
