# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: variation-grid
name: Variation grid
kind: component
catalog: ai
group: generation
tier: 2
maturity: established
status: draft
version: 0.1.0
summary: Show several candidates at once so the user chooses rather than re-prompts; keep the prompt visible
  and reveal cells as they finish.
aliases:
  - 2x2 grid + Vary Subtle/Strong + Upscale (Midjourney)
  - 4-up results (Ideogram, DALL-E, Imagen)
  - Variations (Shape of AI Governors)
  - First Draft alternatives (Figma)
  - /best-of-n (Cursor)
found_in:
  - Midjourney
  - Ideogram
  - ChatGPT images
  - Gemini images
  - Figma
  - Cursor
anatomy:
  - part: grid-of-2
    description: grid of 2–4 candidates, identical aspect ratio
  - part: per-cell-skeleton
    description: per-cell skeleton with progressive reveal
  - part: per-item-actions
    description: "per-item actions: select, vary, upscale, download"
  - part: grid-level-more-like
    description: grid-level 'more like this'
  - part: prompt-shown-beneath
    description: prompt shown beneath with reuse
states:
  - id: complete
  - id: selected
modes:
  - id: generating
    notes: generating (per-cell)
  - id: partial-failure
api:
  interactions:
    - select one to continue
    - vary creates a new grid
    - compare side by side
accessibility:
  notes: List/grid semantics with per-item names ('Variation 2 of 4'); generated alt text editable; keyboard
    selection.
tokens:
  consumes:
    - space.gap.sm
    - radius.md
    - color.bg.surface-secondary
    - shadow.sm
usage:
  use_when:
    - image, video, design or code outputs where variability is the point
  avoid_when:
    - mixed aspect ratios in one grid
    - all-or-nothing loading
  pairs_well_with:
    - generation-progress
    - attachment-preview
    - content-credentials
  reuses:
    - grid
    - card
    - image
    - skeleton
    - icon-button
    - dialog
  exemplars:
    - Midjourney — grid with Vary/Upscale actions (product behaviour; docs page not fetched)
    - Apple HIG — 'Offering people a choice can give them a greater sense of control'
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://developer.apple.com/design/human-interface-guidelines/generative-ai
  - https://cursor.com/changelog/3-0
