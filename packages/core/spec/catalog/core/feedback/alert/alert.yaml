id: alert
name: Alert
kind: component
catalog: core
group: feedback
tier: 1
atomic_level: molecule
maturity: established
status: draft
version: 0.1.0
summary: Contextual, in-page message about the state of a task, region or system.
aliases:
  - InlineMessage
  - Callout
  - Banner
  - Notification (inline)
  - SectionMessage
  - MessageBar
  - Notification banner
  - Site alert
  - Summary box
  - Flag
found_in:
  - Material 3
  - Carbon
  - Polaris
  - Spectrum
  - Atlassian
  - Primer
  - GOV.UK
  - USWDS
  - Ant Design
  - MUI
  - Chakra UI
  - Mantine
  - shadcn/ui
  - Fluent 2
  - Nuxt UI
  - PrimeVue
  - Bootstrap 5
  - Open UI
anatomy:
  - part: container
    description: container
  - part: status-icon
    description: status icon
  - part: title
    description: title
  - part: body
    description: body
  - part: action-links
    description: action links
  - part: dismiss-button
    description: dismiss button
variants:
  - axis: variant
    values:
      - info
      - success
      - warning
      - danger/error
      - neutral
      - inline
      - page-level/global
      - dismissible
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: success
  - id: warning
  - id: invalid
modes:
  - id: info
  - id: dismissed
accessibility:
  apg:
    pattern: Alert
    url: https://www.w3.org/WAI/ARIA/apg/patterns/alert/
  notes: >-
    ARIA: Static messages are plain regions; messages appearing in response to an action use `role="alert"` or
    `role="status"`.

    Keyboard: Dismiss and action controls are focusable; Escape may dismiss a page-level banner.
tokens:
  consumes:
    - color.bg.info-subtle
    - color.border.info
    - radius.surface
    - space.inset.md
    - color.fg.default
    - size.icon.md
usage:
  use_when:
    - Explaining an error, warning about consequences, confirming a state that persists
  avoid_when:
    - The message is transient — use a toast
    - It blocks the flow — use a dialog
  pairs_well_with:
    - form-error-summary
    - button
    - toast
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/alert/
  - https://m3.material.io/components
