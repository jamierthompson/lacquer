accessibility:
  notes: >-
    ARIA: Container is `role="region"` with `aria-label`; each toast uses `role="status"` (polite) or `alert`
    for errors.

    Keyboard: F6 or a documented shortcut moves focus to the toast region; Escape dismisses; hover and focus
    pause the timer.
