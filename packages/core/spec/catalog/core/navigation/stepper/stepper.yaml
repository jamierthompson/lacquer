anatomy:
  - part: step-list
    description: step list
  - part: step-markers
    description: step markers
  - part: connectors
    description: connectors
  - part: labels
    description: labels
  - part: descriptions
    description: descriptions
  - part: current-indicator
    description: current indicator
  - part: step-content
    description: step content
  - part: navigation-buttons
    description: navigation buttons
variants:
