    - color.border.default
    - type.label.sm
    - space.gap.sm
usage:
  use_when:
    - Checkout, onboarding, multi-part applications
  avoid_when:
    - Steps are non-linear — use tabs or a task list
  pairs_well_with:
    - form
    - progress
    - button
rules:
