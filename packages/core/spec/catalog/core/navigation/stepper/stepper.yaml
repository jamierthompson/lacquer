    values:
      - horizontal
      - vertical
      - numbered
      - with-icons
      - compact
      - clickable
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
