# Source of truth for this entry. SKILL.md and dist/ are generated from it by `pnpm build`.

id: toc
name: Table of Contents
kind: component
catalog: core
group: navigation
tier: 3
atomic_level: organism
maturity: established
status: draft
version: 0.1.0
summary: In-page navigation listing a document's headings, with the current section highlighted.
aliases:
  - Anchor
  - In-page navigation
  - TableOfContents
  - On this page
  - ContentToc
found_in:
  - Ant Design
  - Mantine
  - Ark UI
  - USWDS
  - Nuxt UI
anatomy:
  - part: nav-landmark
    description: nav landmark
  - part: heading-links
    description: heading links
  - part: nesting
    description: nesting
  - part: active-indicator
    description: active indicator
  - part: sticky-container
    description: sticky container
variants:
  - axis: variant
    values:
      - sidebar
      - inline
      - collapsible
      - with-scroll-spy
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: current
accessibility:
  apg:
    pattern: Landmarks
    url: https://www.w3.org/WAI/ARIA/apg/patterns/landmarks/
  notes: |-
    ARIA: `nav[aria-label="On this page"]`; active entry uses `aria-current="location"` or `"true"`.
    Keyboard: Standard link tabbing; activation moves focus to the target heading.
tokens:
  consumes:
    - type.body.sm
    - color.fg.muted
    - color.fg.accent
    - space.stack.xs
usage:
  use_when:
    - Documentation, long articles, policy pages, long model answers
  avoid_when:
    - Fewer than about four sections
  pairs_well_with:
    - prose
    - heading
    - scroll-area
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/landmarks/
  - https://ant.design/components/overview/
  - https://mantine.dev/core/package/
