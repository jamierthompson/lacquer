accessibility:
  apg:
    pattern: Menu Button
    url: https://www.w3.org/WAI/ARIA/apg/patterns/menu-button/
  notes: >-
    ARIA: Trigger has `aria-haspopup="menu"` + `aria-expanded`; list is `role="menu"` with
    `menuitem`/`menuitemcheckbox`/`menuitemradio`.

    Keyboard: Enter/Space/Down opens and focuses the first item; Up/Down move; type-ahead; Right/Left for
    submenus; Escape closes and restores focus.
