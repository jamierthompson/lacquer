  - Open UI
anatomy:
  - part: nav-landmark
    description: nav landmark
  - part: ordered-list
    description: ordered list
  - part: links
    description: links
  - part: separators
    description: separators
  - part: current-page
    description: current page
  - part: overflow-menu
    description: overflow menu
variants:
  - axis: variant
    values:
      - chevron
      - slash
      - with-overflow
      - with-icons
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: current
accessibility:
  apg:
    pattern: Breadcrumb
    url: https://www.w3.org/WAI/ARIA/apg/patterns/breadcrumb/
  notes: |-
    ARIA: `nav[aria-label="Breadcrumb"]` wrapping an `ol`; current item uses `aria-current="page"`.
    Keyboard: Standard link tabbing; the overflow menu follows the Menu Button pattern.
tokens:
  consumes:
    - type.body.sm
    - color.fg.muted
    - color.fg.link
    - space.gap.2xs
usage:
