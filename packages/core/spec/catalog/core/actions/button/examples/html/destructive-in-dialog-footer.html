<!--
  id: destructive-in-dialog-footer — one destructive action, one secondary escape.
  Exactly one primary-weight action in the view (LQ-BUTTON-03); destructive is
  an emphasis, not a colour. Labels name the object, never "OK" / "Cancel"
  (LQ-COPY-01).
-->
<div
  style="display: flex; justify-content: flex-end; gap: var(--lq-space-gap-sm)"
>
  <button type="button" data-lacquer="button" data-emphasis="secondary">
    <span data-slot="label">Keep project</span>
  </button>
  <button type="button" data-lacquer="button" data-emphasis="destructive">
    <span data-slot="label">Delete project</span>
  </button>
</div>
