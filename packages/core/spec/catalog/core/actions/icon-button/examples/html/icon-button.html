<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon Button — Lacquer reference implementation</title>
    <!--
    Reference implementation for the html renderer.
    Spec: spec/catalog/core/actions/icon-button/icon-button.yaml

    The markup pattern is:

      <button type="button" data-lacquer="icon-button" data-emphasis="ghost" data-shape="square" data-size="md" aria-label="Copy code">
        <span data-slot="icon" aria-hidden="true"><svg …/></span>
        <span data-slot="badge">3</span>                              optional
      </button>

    The name is aria-label on the root, always (LQ-NAME-01); the icon is
    decorative. States are attributes on the native element:
      hard-disabled   disabled
      soft-disabled   aria-disabled="true"
      loading         aria-busy="true" aria-disabled="true" + [data-slot="spinner"] in place of the icon
      selected        aria-pressed="true"   (toggle usage only)
  -->
    <link rel="stylesheet" href="../../../../../../bindings/html.theme.css" />
    <link rel="stylesheet" href="icon-button.css" />
    <style>
      /* Page chrome only. Not part of the component. */
      body {
        margin: 0;
        padding: var(--lq-space-inset-lg);
        background: var(--lq-color-bg-surface);
        color: var(--lq-color-fg-default);
        font: var(--lq-type-body-md);
      }
      h1 {
        font: var(--lq-type-heading-md);
        margin: 0 0 var(--lq-space-gap-lg);
      }
      h2 {
        font: var(--lq-type-label-md);
        color: var(--lq-color-fg-muted);
        margin: var(--lq-space-gap-lg) 0 var(--lq-space-gap-sm);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--lq-space-gap-sm);
      }
      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <h1>Icon Button</h1>

    <h2>Emphasis</h2>
    <div class="row">
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="ghost"
        aria-label="Copy code"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <rect x="5" y="5" width="8" height="8" rx="1" />
            <path
              d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"
            /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Attach file"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path
              d="M10.5 5.5 6 10a1.5 1.5 0 0 0 2 2l5-5a3 3 0 0 0-4-4L4 8a4.5 4.5 0 0 0 6 6l3-3"
            /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="tonal"
        aria-label="Open settings"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <circle cx="8" cy="8" r="2" />
            <path
              d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"
            /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="filled"
        aria-label="Send message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="destructive"
        aria-label="Delete message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M3 4h10M6 4V2.5h4V4M4 4l.7 9h6.6L12 4" /></svg
        ></span>
      </button>
    </div>

    <h2>Shape and size</h2>
    <div class="row">
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="filled"
        data-shape="round"
        data-size="xs"
        aria-label="Send message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="filled"
        data-shape="round"
        data-size="sm"
        aria-label="Send message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="filled"
        data-shape="round"
        data-size="md"
        aria-label="Send message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="filled"
        data-shape="round"
        data-size="lg"
        aria-label="Send message"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg
        ></span>
      </button>
    </div>

    <h2>States</h2>
    <div class="row">
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Enabled"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16"><path d="M3 8h10" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Disabled"
        disabled
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16"><path d="M3 8h10" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Soft-disabled"
        aria-disabled="true"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16"><path d="M3 8h10" /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Loading"
        aria-busy="true"
        aria-disabled="true"
      >
        <span data-slot="spinner" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="outline"
        aria-label="Bold"
        aria-pressed="true"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path
              d="M5 3h4a2.5 2.5 0 0 1 0 5H5zM5 8h5a2.5 2.5 0 0 1 0 5H5z"
            /></svg
        ></span>
      </button>
      <button
        type="button"
        data-lacquer="icon-button"
        data-emphasis="ghost"
        aria-label="Notifications, 3 unread"
      >
        <span data-slot="icon" aria-hidden="true"
          ><svg viewBox="0 0 16 16">
            <path
              d="M4 11V7a4 4 0 0 1 8 0v4l1 1H3zM6.5 13.5a1.5 1.5 0 0 0 3 0"
            /></svg
        ></span>
        <span
          data-slot="badge"
          style="
            font: var(--lq-type-label-sm);
            padding: 0 var(--lq-space-gap-xs);
            border-radius: var(--lq-radius-pill);
            background: var(--lq-color-bg-primary);
            color: var(--lq-color-fg-on-primary);
          "
          >3</span
        >
      </button>
    </div>
    <p style="color: var(--lq-color-fg-muted)">
      Hover, focus-visible and active are live: use the pointer and the
      keyboard.
    </p>
  </body>
</html>
