  - id: active
  - id: disabled
accessibility:
  apg:
    pattern: Button
    url: https://www.w3.org/WAI/ARIA/apg/patterns/button/
  notes: |-
    ARIA: `button` with `aria-label="Close"` (or a more specific name).
    Keyboard: Enter/Space closes; Escape must close the container too.
