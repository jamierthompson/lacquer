# Source of truth for this entry. SKILL.md and dist/ are generated from it by `pnpm build`.

id: status-indicator
name: Status Indicator
kind: component
catalog: core
group: data-display
tier: 2
atomic_level: atom
maturity: established
status: draft
version: 0.1.0
summary: A small dot or light conveying operational or presence status, always paired with text.
aliases:
  - Status light
  - Indicator
  - StateLabel
  - PresenceBadge
  - Dot
  - Health dot
found_in:
  - Spectrum
  - Polaris
  - Mantine
  - Chakra UI
  - Primer
  - Fluent 2
  - Ant Design
anatomy:
  - part: dot-ring
    description: dot/ring
  - part: label-text
    description: label text
  - part: optional-pulse-animation
    description: optional pulse animation
variants:
  - axis: variant
    values:
      - neutral
      - info
      - success
      - warning
      - danger
      - pending
      - pulsing
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
accessibility:
  notes: |-
    ARIA: Dot is `aria-hidden`; the status must exist as text or via `aria-label` on the container.
    Keyboard: None.
tokens:
  consumes:
    - color.bg.success
    - color.bg.danger
    - size.icon.xs
    - radius.full
    - motion.duration.slow
usage:
  use_when:
    - Service health, user presence, job/run state, model availability
  avoid_when:
    - Colour is the only differentiator between states
  pairs_well_with:
    - avatar
    - list-view
    - stat
    - tag
  ai_products_rely_on: true
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://opensource.adobe.com/spectrum-design-data/components
  - https://github.com/Shopify/polaris/tree/main/polaris-react/src/components
