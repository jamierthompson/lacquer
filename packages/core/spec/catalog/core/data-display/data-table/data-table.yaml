  - Primer
  - Ant Design
  - MUI
  - Atlassian
  - shadcn/ui
  - Spectrum
  - Fluent 2
  - PrimeVue
  - Nuxt UI
anatomy:
  - part: toolbar
    description: toolbar
  - part: search-filters
    description: search/filters
  - part: bulk-action-bar
    description: bulk-action bar
  - part: column-headers
    description: column headers with sort
  - part: select-all-checkbox
    description: select-all checkbox
  - part: rows
    description: rows
  - part: row-actions
    description: row actions
  - part: pagination
    description: pagination
  - part: column-settings
    description: column settings
  - part: empty-state
    description: empty state
variants:
  - axis: variant
    values:
      - sortable
      - selectable
      - filterable
      - resizable-columns
      - sticky-columns
      - expandable-rows
      - editable
      - virtualized
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: selected
  - id: indeterminate
  - id: loading
  - id: skeleton
  - id: empty
  - id: invalid
  - id: dragging
accessibility:
  apg:
    pattern: Grid
    url: https://www.w3.org/WAI/ARIA/apg/patterns/grid/
  notes: >-
    ARIA: `role="grid"` with `aria-sort` on sortable headers, `aria-rowcount`/`aria-colcount` when
    virtualized.

    Keyboard: Roving focus across cells; Arrow keys move; Home/End/Ctrl+Home to bounds; Space toggles row
    selection; Enter activates.
tokens:
  consumes:
    - type.body.sm
    - space.inset.cell
    - color.bg.selected
    - color.border.subtle
    - z.sticky
    - shadow.sm
usage:
  use_when:
    - Admin consoles, analytics, record management
  avoid_when:
    - Under ~20 rows with no operations — a plain table is far cheaper
  pairs_well_with:
    - pagination
    - tag
    - dropdown-menu
    - empty-state
    - virtual-list
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/grid/
  - https://carbondesignsystem.com/components/overview/components/
  - https://github.com/Shopify/polaris/tree/main/polaris-react/src/components
