id: list-view
name: List View
kind: component
catalog: core
group: data-display
tier: 1
atomic_level: organism
maturity: established
status: draft
version: 0.1.0
summary: Vertically stacked rows of structured records with optional selection and row actions.
aliases:
  - List
  - ListItem
  - ResourceList
  - ActionList
  - Collection
  - Structured list
  - Item
found_in:
  - Material 3
  - Carbon
  - Polaris
  - Spectrum
  - Primer
  - Ant Design
  - MUI
  - Fluent 2
  - Apple HIG
  - Nuxt UI
  - Open UI
  - shadcn/ui
anatomy:
  - part: list-container
    description: list container
  - part: row
    description: row
  - part: leading-media-avatar
    description: leading media/avatar
  - part: primary-text
    description: primary text
  - part: secondary-text
    description: secondary text
  - part: metadata
    description: metadata
  - part: trailing-actions
    description: trailing actions
  - part: selection-checkbox
    description: selection checkbox
  - part: divider
    description: divider
variants:
  - axis: variant
    values:
      - simple
      - two-line
      - three-line
      - selectable
      - with-actions
      - grouped
      - virtualized
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: selected
  - id: current
  - id: loading
  - id: skeleton
  - id: empty
  - id: dragging
accessibility:
  notes: >-
    ARIA: `ul`/`li` for static lists; `role="grid"` or `listbox` only when rows are interactive in a
    coordinated way.

    Keyboard: Static rows tab normally; interactive collections use roving focus with Up/Down and type-ahead.
tokens:
  consumes:
    - space.inset.sm
    - color.border.subtle
    - color.bg.selected
    - type.body.md
    - size.control.row
usage:
  use_when:
    - Conversation histories, inboxes, files, search results
  avoid_when:
    - Records need column comparison — use a table
  pairs_well_with:
    - avatar
    - badge
    - virtual-list
    - empty-state
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
