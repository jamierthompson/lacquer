accessibility:
  apg:
    pattern: Radio Group
    url: https://www.w3.org/WAI/ARIA/apg/patterns/radio/
  notes: |-
    ARIA: `role="radiogroup"` (or fieldset) with `aria-labelledby`; exactly one `aria-checked="true"`.
    Keyboard: One tab stop for the group; Arrow keys move and select; Space selects the focused radio.
tokens:
