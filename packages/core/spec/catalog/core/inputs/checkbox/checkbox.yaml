    pattern: Checkbox
    url: https://www.w3.org/WAI/ARIA/apg/patterns/checkbox/
  notes: >-
    ARIA: Native `input[type=checkbox]`; indeterminate is a DOM property plus `aria-checked="mixed"` on custom
    widgets.

    Keyboard: Space toggles. Enter must not toggle a checkbox.
