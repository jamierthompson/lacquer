id: calendar
name: Calendar
kind: component
catalog: core
group: inputs
tier: 2
atomic_level: organism
maturity: established
status: draft
version: 0.1.0
summary: The standalone month grid used inside date pickers or on its own for date selection.
aliases:
  - DateCalendar
  - RangeCalendar
  - Month grid
  - Single/Double calendar
found_in:
  - shadcn/ui
  - Atlassian
  - Spectrum
  - React Aria
  - Chakra UI
  - Ark UI
  - Ant Design
  - Nuxt UI
  - MUI
anatomy:
  - part: header-with-month-year
    description: header with month/year
  - part: previous-next-buttons
    description: previous/next buttons
  - part: weekday-row
    description: weekday row
  - part: day-cells
    description: day cells
  - part: range-highlight
    description: range highlight
  - part: footer-actions
    description: footer actions
variants:
  - axis: variant
    values:
      - single
      - range
      - multi-month
      - with-week-numbers
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: selected
  - id: current
  - id: drop-target
accessibility:
  apg:
    pattern: Grid
    url: https://www.w3.org/WAI/ARIA/apg/patterns/grid/
  notes: |-
    ARIA: `role="grid"`; today gets `aria-current="date"`; unavailable days use `aria-disabled`.
    Keyboard: Roving focus across the grid with Arrow/Page/Home/End; Enter or Space selects.
tokens:
  consumes:
    - radius.control
    - color.bg.selected
    - color.fg.on-primary
    - type.body.sm
    - space.gap.2xs
usage:
  use_when:
    - Availability views, range selection, inline scheduling
  avoid_when:
    - A single known date is being typed
  pairs_well_with:
    - date-picker
    - popover
    - calendar-view
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/grid/
  - https://ui.shadcn.com/docs/components
  - https://atlassian.design/components
