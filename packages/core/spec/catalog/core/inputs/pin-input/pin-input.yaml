    - type.body.lg
    - color.border.focus
    - space.gap.xs
usage:
  use_when:
    - 2FA codes, email verification, short PINs
  avoid_when:
    - Variable-length secrets
  pairs_well_with:
    - field
    - form
    - alert
rules:
