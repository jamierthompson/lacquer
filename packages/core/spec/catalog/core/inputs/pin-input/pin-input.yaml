id: pin-input
name: PIN Input
kind: component
catalog: core
group: inputs
tier: 2
atomic_level: molecule
maturity: established
status: draft
version: 0.1.0
summary: Fixed-length code entry split across single-character boxes.
aliases:
  - OTP Input
  - InputOTP
  - OneTimePasswordField
  - Digit entry views
  - Verification code
found_in:
  - shadcn/ui
  - Chakra UI
  - Mantine
  - Ark UI
  - Radix
  - Base UI
  - Nuxt UI
  - PrimeVue
  - Apple HIG
anatomy:
  - part: group
    description: group
  - part: character-cells
    description: character cells
  - part: hidden-aggregate-input
    description: hidden aggregate input
  - part: separator
    description: separator
variants:
  - axis: variant
    values:
      - numeric
      - alphanumeric
      - masked
      - with-separator
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: invalid
  - id: filled
  - id: loading
accessibility:
  notes: >-
    ARIA: Group is labelled; use `autocomplete="one-time-code"` and expose the whole value, not one cell at a
    time.

    Keyboard: Typing advances; Backspace moves back; paste fills every cell; Arrow keys move between cells.
tokens:
