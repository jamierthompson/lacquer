id: hover-card
name: Hover Card
kind: component
catalog: core
group: overlays
tier: 2
atomic_level: molecule
maturity: established
status: draft
version: 0.1.0
summary: Rich preview of a linked entity shown after a hover or focus delay.
aliases:
  - Preview card
  - PreviewTrigger
  - Peek
  - Link preview
  - Profile card
found_in:
  - Radix
  - shadcn/ui
  - Chakra UI
  - Mantine
  - Ark UI
  - Base UI
  - React Aria
  - Atlassian
anatomy:
  - part: trigger-link
    description: trigger link
  - part: floating-card
    description: floating card
  - part: avatar-media
    description: avatar/media
  - part: summary
    description: summary
  - part: metadata
    description: metadata
  - part: actions
    description: actions
  - part: arrow
    description: arrow
variants:
  - axis: variant
    values:
      - profile
      - entity
      - link-preview
      - citation
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: expanded
  - id: loading
  - id: invalid
accessibility:
  notes: |-
    ARIA: Supplementary only — everything inside must also be reachable by activating the link.
    Keyboard: Opens on focus with a delay; Escape dismisses; the card content must be reachable by Tab.
tokens:
  consumes:
    - radius.surface
    - shadow.overlay
    - z.popover
    - color.bg.surface
    - motion.duration.base
usage:
  use_when:
    - User mentions, repository or issue links, citation previews in generated answers
  avoid_when:
    - The preview holds information available nowhere else
  pairs_well_with:
    - avatar
    - link
    - popover
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
