id: tooltip
name: Tooltip
kind: component
catalog: core
group: overlays
tier: 1
atomic_level: molecule
maturity: established
status: draft
version: 0.1.0
summary: Brief text label that appears on hover or focus to name or clarify a control.
aliases:
  - Hint
  - Title
  - Tip
  - Toggletip (click variant)
found_in:
  - Material 3
  - Fluent 2
  - Carbon
  - Polaris
  - Spectrum
  - Atlassian
  - Primer
  - USWDS
  - Ant Design
  - MUI
  - Chakra UI
  - Mantine
  - Radix
  - shadcn/ui
  - Base UI
  - Ark UI
  - React Aria
  - Nuxt UI
  - PrimeVue
  - Bootstrap 5
  - Open UI
anatomy:
  - part: trigger
    description: trigger
  - part: floating-label
    description: floating label
  - part: arrow
    description: arrow
  - part: delay-timing
    description: delay timing
variants:
  - axis: variant
    values:
      - label
      - description
      - with-shortcut
      - rich (toggletip)
  - axis: size
    values:
      - sm
      - md
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: expanded
accessibility:
  apg:
    pattern: Tooltip
    url: https://www.w3.org/WAI/ARIA/apg/patterns/tooltip/
  notes: |-
    ARIA: `role="tooltip"` referenced by `aria-describedby` (or `aria-labelledby` when it is the only name).
    Keyboard: Appears on focus, not just hover; Escape dismisses; content must remain hoverable (WCAG 1.4.13).
tokens:
  consumes:
    - radius.control
    - color.bg.inverse
    - color.fg.on-inverse
    - type.body.sm
    - z.tooltip
    - shadow.md
    - motion.duration.fast
usage:
  use_when:
    - Naming icon-only buttons
    - Explaining truncated or abbreviated values
  avoid_when:
    - The content is essential
    - It contains links or controls — use a popover
  pairs_well_with:
    - icon-button
    - kbd
    - truncate
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
