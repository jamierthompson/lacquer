accessibility:
  apg:
    pattern: Carousel
    url: https://www.w3.org/WAI/ARIA/apg/patterns/carousel/
  notes: >-
    ARIA: `role="group"` with `aria-roledescription="carousel"`; slides labelled 'n of m'; auto-rotation needs
    a pause control.

    Keyboard: Left/Right move between slides; Tab reaches controls; auto-rotation stops on hover and focus.
