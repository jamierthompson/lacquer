  - id: playing
  - id: paused
accessibility:
  apg:
    pattern: Slider
    url: https://www.w3.org/WAI/ARIA/apg/patterns/slider/
  notes: |-
    ARIA: Controls are labelled buttons; the scrubber is a slider with `aria-valuetext` in time units.
    Keyboard: Space plays/pauses; Left/Right seek; Up/Down volume; F fullscreen; M mute; C captions.
