name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @lacquer/core's dist/ is what the other packages import (types,
      # loaders, bindings.json); on a fresh checkout it does not exist until
      # core builds, so core builds before anything type-checks against it.
      - run: pnpm --filter @lacquer/core build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Validates every spec and the bindings, compiles dist/, checks that
      # generated files (SKILL.md, tailwind.theme.css, the base registry item)
      # are current, runs the LQ-TOKEN-01 source check, validates the registry.
      - run: pnpm check

      # The grader's tests drive Chromium, so the browser is installed before
      # `pnpm test`; the site's e2e and the grader share one Playwright version.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: packages/grade
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @lacquer/grade exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @lacquer/grade exec playwright install-deps chromium

      - run: pnpm test
      # The finish reports: every committed baseline in apps/site/reports is
      # regenerated; a MUST finding, a lost state, a rule that passed and now
      # fails, or a lower score fails the job.
      - run: pnpm grade:check
      - run: pnpm build
      # playwright.config.ts serves the build from `pnpm start` when CI is set.
      - run: pnpm test:e2e
      # Last, so a new advisory on a transitive dependency does not hide a
      # test result; it still fails the job.
      - run: pnpm audit --prod --audit-level=high

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-failure-${{ github.run_attempt }}
          path: |
            apps/site/playwright-report
            apps/site/test-results
          if-no-files-found: ignore
