# Source of truth for this entry. SKILL.md and spec/dist are generated from it by `npm run spec:build`.

id: plan-view
name: Plan view / task list
kind: component
catalog: ai
group: agentic
tier: 1
maturity: emerging
status: draft
version: 0.1.0
summary: The agent proposes an editable plan before acting; approval is explicit and changes the agent's mode visibly.
aliases:
  - Plan, Task, Queue (AI Elements)
  - Action plan (Shape of AI)
  - plan mode (Claude Code, Cursor)
  - Plan mode (Lovable)
  - todo lists (Windsurf Cascade)
  - Steps (prompt-kit)
found_in:
  - Claude Code
  - Cursor
  - Lovable
  - Windsurf
  - AI Elements
  - prompt-kit
anatomy:
  - part: title-and-summary
    description: title and summary
  - part: ordered-steps
    description: ordered steps with status glyph (pending, active with shimmer, done, error, skipped)
  - part: files-artifacts-per-step
    description: files/artifacts per step
  - part: footer
    description: "footer: Approve / Edit plan / Keep planning"
  - part: editable-as-markdown
    description: editable as markdown
states:
  - id: awaiting-approval
  - id: complete
modes:
  - id: drafting
    notes: drafting (streaming)
  - id: approved
    notes: approved (mode switch)
  - id: executing
    notes: executing (progress n/m)
  - id: abandoned
api:
  interactions:
    - edit plan text
    - approve with explicit mode choice
    - keep planning with feedback
    - collapse when executing
accessibility:
  notes: Ordered list with per-step status text; approval controls are buttons with focus on the safest option;
    progress announced per step.
tokens:
  consumes:
    - color.status.pending
    - color.status.running
    - color.status.success
    - color.status.error
    - shimmer.duration
    - type.body.sm
usage:
  use_when:
    - multi-step agent tasks
    - any edit to code or data
  avoid_when:
    - single-shot answers
  pairs_well_with:
    - agent-status
    - approval-prompt
    - autonomy-dial
    - activity-log
  reuses:
    - disclosure
    - list
    - checkbox
    - badge
    - button
    - textarea
  exemplars:
    - Claude Code — 'Yes, and use auto mode' / 'Yes, manually approve edits' / 'No, keep planning'
    - Lovable — plan as a readable markdown document, edits blocked until approved
    - AI Elements Plan/Task — streaming shimmer, file chips, progress counters
rules:
  shared:
    - LQ-TOKEN-01
    - LQ-ANAT-01
sources:
  - https://code.claude.com/docs/en/permission-modes
  - https://docs.lovable.dev/features/plan-mode.md
  - https://elements.ai-sdk.dev/components/plan
  - https://elements.ai-sdk.dev/components/task
