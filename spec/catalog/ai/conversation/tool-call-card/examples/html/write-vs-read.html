<!--
  id: write-vs-read — the effect axis is visible while collapsed (LQ-TOOL-02).
  A read has no edge; a write has a running-coloured edge; a destroy has an
  error-coloured edge and, here, is also waiting for approval.
-->
<div style="display: grid; gap: var(--lq-space-gap-sm)">

  <div role="group" aria-labelledby="w1-name" data-lacquer="tool-call-card" data-state="output-available" data-effect="read">
    <button type="button" data-slot="header" aria-expanded="false" aria-controls="w1-body">
      <span data-slot="name" id="w1-name">Read 3 files</span>
      <span data-slot="status">Completed</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div data-slot="body" id="w1-body" role="region" aria-labelledby="w1-name" hidden>
      <pre data-slot="output">{ "files": 3 }</pre>
    </div>
  </div>

  <div role="group" aria-labelledby="w2-name" data-lacquer="tool-call-card" data-state="output-available" data-effect="write">
    <button type="button" data-slot="header" aria-expanded="false" aria-controls="w2-body">
      <span data-slot="name" id="w2-name">Wrote src/button.css</span>
      <span data-slot="status">Completed</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div data-slot="body" id="w2-body" role="region" aria-labelledby="w2-name" hidden>
      <pre data-slot="output">{ "bytes": 2048 }</pre>
    </div>
  </div>

  <div role="group" aria-labelledby="w3-name" data-lacquer="tool-call-card" data-state="approval-requested" data-effect="destroy">
    <button type="button" data-slot="header" aria-expanded="true" aria-controls="w3-body">
      <span data-slot="name" id="w3-name">Delete dist/ (14 files)</span>
      <span data-slot="status">Needs approval</span>
      <span data-slot="chevron" aria-hidden="true">›</span>
    </button>
    <div data-slot="body" id="w3-body" role="region" aria-labelledby="w3-name">
      <pre data-slot="input">{ "path": "dist/" }</pre>
      <div data-slot="actions">
        <button type="button" data-lacquer="button" data-emphasis="outline" data-size="xs" autofocus><span data-slot="label">Deny</span></button>
        <button type="button" data-lacquer="button" data-emphasis="primary" data-size="xs"><span data-slot="label">Approve once</span></button>
      </div>
    </div>
  </div>

</div>
