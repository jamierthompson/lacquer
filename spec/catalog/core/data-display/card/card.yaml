anatomy:
  - part: surface
    description: surface
  - part: media-slot
    description: media slot
  - part: header
    description: header
  - part: title
    description: title
  - part: subtitle
    description: subtitle
  - part: body
    description: body
  - part: footer-actions
    description: footer/actions
  - part: overlay-link
    description: overlay link
variants:
  - axis: variant
    values:
      - elevated
      - outlined
      - filled
      - interactive
      - horizontal
      - selectable
      - with-media
  - axis: size
    values:
      - sm
      - md
      - lg
states:
  - id: enabled
  - id: hover
  - id: focus-visible
  - id: active
  - id: disabled
  - id: selected
  - id: loading
  - id: skeleton
  - id: dragging
accessibility:
  notes: >-
    ARIA: If the whole card is clickable, use one link with the accessible name and avoid nested interactive
    elements.

    Keyboard: Interactive cards are a single tab stop activated by Enter (link) or Enter/Space (button).
tokens:
  consumes:
    - radius.surface
    - shadow.sm
    - color.bg.surface
    - color.border.subtle
    - space.inset.md
usage:
  use_when:
    - Dashboards, entity summaries, settings groups, result lists
  avoid_when:
    - Cards nest inside cards
    - The content is a plain list — rows are denser and easier to scan
  pairs_well_with:
    - grid
    - badge
    - button
    - skeleton
  ai_products_rely_on: true
rules:
  shared:
    - LQ-STATE-01
    - LQ-STATE-02
    - LQ-STATE-03
    - LQ-FOCUS-01
    - LQ-SEM-01
    - LQ-NAME-01
    - LQ-TOKEN-01
    - LQ-ANAT-01
