accessibility:
  apg:
    pattern: Combobox
    url: https://www.w3.org/WAI/ARIA/apg/patterns/combobox/
  notes: >-
    ARIA: Combobox inside a modal dialog; results are a listbox with `aria-activedescendant`; announce result
